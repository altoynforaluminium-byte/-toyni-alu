<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AL-TONY Aluminum</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#070b16">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AL-TONY"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>

/* ===== نظام التصميم العصري AL-TONY ===== */
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
  --ac:#f2b705;--on:#1a1405;--er:#ff6d6d;
  --bg:#070b16;--bg2:#0e1626;
  --cd:rgba(148,163,184,.09);--in:rgba(148,163,184,.11);
  --tx:#eef2f9;--mu:#8b97ad;--bd:rgba(148,163,184,.17);
  --cbl:14px;
  --r-lg:22px;--r-md:16px;--r-sm:12px;
  --sh-soft:0 10px 30px rgba(2,6,17,.35);
  --sh-card:0 4px 20px rgba(2,6,17,.28);
}
:root[data-theme="light"]{
  --bg:#eef1f7;--bg2:#ffffff;
  --cd:rgba(255,255,255,.78);--in:#eef1f7;
  --tx:#101828;--mu:#5b6478;--bd:#e2e7f0;--er:#d33;
  --sh-soft:0 10px 30px rgba(15,23,42,.10);
  --sh-card:0 4px 18px rgba(15,23,42,.07);
}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--tx);
  font-family:"Segoe UI","Helvetica Neue",Tahoma,Arial,sans-serif;
  line-height:1.55;letter-spacing:.1px;
  padding:14px 14px 120px;min-height:100vh;
  background:
    radial-gradient(900px 480px at 88% -10%,color-mix(in srgb,var(--ac) 16%,transparent),transparent 62%),
    radial-gradient(700px 500px at -10% 30%,rgba(99,102,241,.10),transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
body.ed{padding-bottom:400px}
::selection{background:color-mix(in srgb,var(--ac) 38%,transparent)}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--bd) 80%,transparent) transparent}
*::-webkit-scrollbar{height:8px;width:8px}
*::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--mu) 45%,transparent);border-radius:99px}
*::-webkit-scrollbar-track{background:transparent}

/* ===== الهيدر ===== */
header{
  display:flex;align-items:center;gap:12px;
  margin:2px auto 16px;max-width:860px;width:100%;
  padding:12px 14px;position:relative;overflow:hidden;
  background:var(--cd);border:1px solid var(--bd);border-radius:var(--r-lg);
  backdrop-filter:blur(var(--cbl));-webkit-backdrop-filter:blur(var(--cbl));
  box-shadow:var(--sh-card);
}
header:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,color-mix(in srgb,var(--ac) 9%,transparent),transparent 42%);pointer-events:none}
header:after{content:"";position:absolute;inset-inline-start:0;top:14px;bottom:14px;width:4px;border-radius:99px;background:linear-gradient(180deg,var(--ac),color-mix(in srgb,var(--ac) 45%,transparent))}
.lg{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex:0 0 auto;overflow:hidden;color:var(--on);font-weight:900;
  background:linear-gradient(140deg,color-mix(in srgb,var(--ac) 88%,#fff),color-mix(in srgb,var(--ac) 70%,#7a5200));
  box-shadow:0 8px 20px color-mix(in srgb,var(--ac) 42%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.lg img{width:100%;height:100%;object-fit:contain}
.lg.s{width:36px;height:36px;border-radius:11px;font-size:18px}
.tt{font-size:19px;font-weight:800;direction:ltr;unicode-bidi:plaintext;letter-spacing:.3px}
.sb2{font-size:12px;color:var(--mu);margin-top:2px}
.dt{margin-inline-start:auto;font-size:11px;color:var(--mu);text-align:left}

/* ===== البطاقات ===== */
main{max-width:860px;margin-inline:auto;width:100%}
.cd{
  background:var(--cd);border:1px solid var(--bd);border-radius:var(--r-lg);
  padding:16px;margin-bottom:14px;
  backdrop-filter:blur(var(--cbl));-webkit-backdrop-filter:blur(var(--cbl));
  box-shadow:var(--sh-card);
  transition:border-color .2s ease,box-shadow .2s ease;
}
.cd:hover{border-color:color-mix(in srgb,var(--ac) 30%,var(--bd))}
.cd:focus-within{border-color:color-mix(in srgb,var(--ac) 50%,var(--bd));box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 12%,transparent),var(--sh-card)}
.cd>h2{cursor:pointer;user-select:none}
.cd.fold .bd{display:none}
.cd.fold>h2{margin-bottom:0}
h2{font-size:16px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:9px;letter-spacing:.2px}
h2:before{content:"";width:5px;height:17px;border-radius:99px;background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 85%,#fff),var(--ac));box-shadow:0 2px 8px color-mix(in srgb,var(--ac) 50%,transparent)}
h2:has(.sn):before{display:none}
.sn{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:50%;background:linear-gradient(140deg,color-mix(in srgb,var(--ac) 88%,#fff),var(--ac));color:var(--on);font-size:14px;font-weight:800;flex:0 0 auto;box-shadow:0 3px 10px color-mix(in srgb,var(--ac) 40%,transparent)}
.sm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--mu);font-weight:400}
.cv{color:var(--mu);font-style:normal;flex:0 0 auto;transition:transform .2s ease}
.cd.fold .cv{transform:rotate(-90deg)}
.pv{font-size:12px;color:var(--mu);font-weight:700;letter-spacing:.3px;display:inline-flex;align-items:center;gap:7px;margin:4px 0 6px}
.pv:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px color-mix(in srgb,var(--ac) 65%,transparent)}

/* ===== الجداول ===== */
.sc{overflow-x:auto;border-radius:var(--r-md);border:1px solid var(--bd);background:color-mix(in srgb,var(--in) 40%,transparent)}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:8px 5px;text-align:center;font-size:12px;white-space:nowrap;border-bottom:1px solid var(--bd)}
tbody tr:last-child td{border-bottom:0}
th{color:var(--mu);font-weight:700;background:color-mix(in srgb,var(--bg2) 82%,var(--in));position:sticky;top:0;z-index:1;font-size:11.5px}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--in) 35%,transparent)}
.gs{border-inline-start:2px solid color-mix(in srgb,var(--ac) 65%,transparent)}
.ht th,.ht td{min-width:88px}
.ht th:first-child,.ht td:first-child{min-width:74px;position:sticky;right:0;background:var(--bg2);z-index:2}
.ht th:first-child{top:0}
.ht select{width:100%;font-size:12px;padding:6px 2px;margin-bottom:4px}
.ht .bx{min-width:0;padding:10px 2px;text-align:center;font-size:13px;white-space:nowrap}
.ht input{min-width:0}

/* ===== الحقول ===== */
input,select,textarea{
  box-sizing:border-box;padding:10px 8px;border:1px solid var(--bd);border-radius:var(--r-sm);
  background:var(--in);color:var(--tx);font-size:14px;text-align:center;min-width:0;font-family:inherit;
  transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
}
input{width:100%;min-width:58px}
textarea{width:100%;height:84px;font-size:11px;line-height:1.7}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--mu) 55%,var(--bd))}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent)}
option{background:var(--bg2);color:var(--tx)}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--ac);height:28px}
input[type=range]:focus{box-shadow:none}

/* ===== الأزرار ===== */
button{
  background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 86%,#fff) 0%,var(--ac) 100%);
  color:var(--on);border:0;border-radius:14px;padding:11px 16px;
  font-weight:800;font-size:14px;margin:8px 0 0 8px;font-family:inherit;cursor:pointer;
  box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 32%,transparent),inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .15s ease,filter .15s ease,box-shadow .15s ease,background .15s ease;
}
button:hover{filter:brightness(1.06)}
button:active{transform:scale(.965)}
button.g{
  background:var(--in);color:var(--tx);border:1px solid var(--bd);box-shadow:none;font-weight:700;
}
button.g:hover{background:color-mix(in srgb,var(--in) 65%,var(--tx) 6%);border-color:color-mix(in srgb,var(--mu) 55%,var(--bd))}
button.g.on{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 86%,#fff),var(--ac));color:var(--on);border-color:transparent;box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 30%,transparent)}
.sw{width:38px;height:38px;border-radius:50%;padding:0;margin:0;border:3px solid transparent;box-shadow:none}
.sw.on{border-color:var(--tx)}

/* ===== عناصر مساعدة ===== */
.f{display:flex;gap:6px;align-items:center;margin:6px 0}.f>*{flex:1}.f>span{flex:0 0 52px;font-size:12px;color:var(--mu)}
.r{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--bd);font-size:14px}
.er{color:var(--er);font-weight:700}
.fin{
  margin-top:14px;padding:16px 18px;border-radius:var(--r-md);
  background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 92%,#fff),var(--ac) 55%,color-mix(in srgb,var(--ac) 72%,#7a5200));
  color:var(--on);display:flex;justify-content:space-between;align-items:center;font-weight:800;
  box-shadow:0 12px 30px color-mix(in srgb,var(--ac) 35%,transparent),inset 0 1px 0 rgba(255,255,255,.35);
  position:relative;overflow:hidden;
}
.fin:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 45%,transparent 60%);pointer-events:none}
.fin b{font-size:23px;letter-spacing:.3px}
.bx{min-width:84px;padding:10px 4px;border:1px solid var(--bd);border-radius:var(--r-sm);background:var(--bg2);font-size:15px;font-weight:700;direction:rtl;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.bx:hover{border-color:color-mix(in srgb,var(--ac) 45%,var(--bd))}
.bx.on{border:2px solid var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 15%,transparent)}
.bx.on{direction:ltr;unicode-bidi:isolate;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;white-space:normal;min-height:38px}
.m2{margin-top:10px;padding:10px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--ac) 12%,var(--in));border:1px solid color-mix(in srgb,var(--ac) 40%,var(--bd));font-size:14px;font-weight:800;color:var(--ac);text-align:center}
.xb{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.xb button{margin:0;padding:8px 10px;font-size:13px;flex:1}
.sh{display:flex;align-items:center;gap:10px;padding:11px 12px;margin-bottom:10px;border:1px solid var(--bd);border-radius:var(--r-md);background:var(--in)}
.sh .nm{font-weight:800;font-size:14px}
.sh .pni{margin-top:4px;text-align:right}
.sh .pni input{background:var(--bg2)}
.sh .dtm{font-size:11px;color:var(--mu);text-align:left;max-width:96px}
.pt{border:1px solid var(--bd);border-radius:var(--r-md);padding:12px;margin-top:10px;background:var(--in)}
.pt.off{opacity:.55}
.ph{display:flex;align-items:center;gap:8px}
.ph b{flex:1}
.ph span{font-size:12px;color:var(--mu)}
.ph input{width:72px;min-width:0}
.pb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pb small{display:block;color:var(--mu);font-size:11px;margin-bottom:3px}
.pb .bx{min-width:0;text-align:center;background:var(--bg2)}
.pr{margin-top:6px;font-size:12px;color:var(--mu)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g3 label{font-size:12px;color:var(--mu);font-weight:600}
.g3 input{margin-top:4px;min-width:0}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

/* ===== شريط التنقل السفلي ===== */
#nv{
  position:fixed;left:50%;transform:translateX(-50%);right:auto;
  width:min(580px,calc(100% - 24px));
  bottom:calc(12px + env(safe-area-inset-bottom,0px));
  display:flex;gap:4px;padding:6px;z-index:5;
  background:color-mix(in srgb,var(--bg2) 82%,transparent);
  border:1px solid var(--bd);border-radius:26px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 14px 40px rgba(2,6,17,.45);
}
:root[data-theme="light"] #nv{background:color-mix(in srgb,var(--bg2) 88%,transparent);box-shadow:0 14px 34px rgba(15,23,42,.16)}
#nv button{flex:1;margin:0;background:transparent;color:var(--mu);box-shadow:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:8px 0;border-radius:20px;transition:color .18s,background .18s}
#nv button.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 13%,transparent)}
#nv i{font-style:normal;font-size:21px;transition:transform .18s ease}
#nv button.on i{transform:translateY(-1px) scale(1.08)}

/* ===== زر الحفظ العائم ===== */
#fab:not(.un){background:var(--bg2);color:var(--tx);border:1px solid var(--bd);box-shadow:0 8px 22px rgba(2,6,17,.4)}
#fab.un{animation:pl 1.6s infinite}
@keyframes pl{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--ac) 24%,transparent)}}
#fab{position:fixed;left:14px;bottom:calc(90px + env(safe-area-inset-bottom,0px));margin:0;z-index:5;border-radius:99px;padding:12px 18px;font-weight:800}

/* ===== لوحة المفاتيح ===== */
#kp{display:none;position:fixed;left:0;right:0;bottom:0;z-index:10;
  background:color-mix(in srgb,var(--bg2) 94%,transparent);
  border-top:1px solid var(--bd);border-radius:26px 26px 0 0;
  padding:8px 12px calc(12px + env(safe-area-inset-bottom,0px));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 -14px 44px rgba(2,6,17,.5);
}
#kp.on{display:block}
#kp:before{content:"";display:block;width:46px;height:5px;border-radius:99px;background:var(--bd);margin:2px auto 10px}
#kp .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
#kp button{margin:0;padding:12px 0;font-size:17px;box-shadow:none;font-weight:700}
#ki{font-size:13px;margin-bottom:8px;text-align:center}
.ki{font-size:13px;text-align:center;margin-bottom:8px;min-height:18px;color:var(--mu)}
.kpd{margin-top:10px;padding:10px;border:1px solid var(--bd);border-radius:var(--r-md);background:var(--bg2)}
.kpd .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kpd button{margin:0;padding:12px 0;font-size:17px;box-shadow:none;font-weight:700}
.kpd.pin{position:sticky;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:4;box-shadow:0 -8px 24px rgba(2,6,17,.4)}
.kpd button{padding:10px 0;font-size:16px}
.kh{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.kh .ki{flex:1;margin:0}
.kh button{margin:0;padding:7px 11px;font-size:13px}
.kpd.min .g4{display:none}
.kpd.min .kh{margin-bottom:0}
.ch{padding:5px 2px;font-size:15px;line-height:1.2}
.cr{display:inline-block;width:2px;height:1.3em;background:var(--ac);animation:cbl 1s steps(1) infinite;border-radius:2px}
@keyframes cbl{50%{opacity:0}}

/* ===== التنبيهات ===== */
#toast{display:none;position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 24px));z-index:30;
  background:color-mix(in srgb,var(--bg2) 92%,transparent);color:var(--tx);
  border:1px solid color-mix(in srgb,var(--ac) 55%,var(--bd));border-radius:var(--r-md);
  padding:13px;text-align:center;font-size:14px;font-weight:600;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 14px 40px rgba(2,6,17,.5);
}

/* ===== معرض الصور ===== */
.photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.photo-card{overflow:hidden;border:1px solid var(--bd);border-radius:var(--r-md);background:var(--in);min-width:0;box-shadow:var(--sh-card);transition:transform .18s ease,border-color .18s ease}
.photo-card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--ac) 40%,var(--bd))}
.photo-thumb{display:block;width:100%;height:134px;object-fit:cover;background:var(--bg2);cursor:zoom-in;transition:transform .35s ease,filter .2s ease}
.photo-card:hover .photo-thumb{transform:scale(1.05);filter:brightness(1.05)}
.photo-meta{padding:10px}
.photo-name{font-size:12px;font-weight:800;margin-bottom:6px}
.photo-actions{display:flex;gap:6px;flex-wrap:wrap}
.photo-actions button{flex:1;margin:0;padding:8px 7px;font-size:11px;white-space:nowrap;font-weight:700}
.photo-note{font-size:11px;color:var(--mu);line-height:1.8;margin-top:10px}
#photo-viewer{position:fixed;inset:0;z-index:1000;background:rgba(2,6,23,.94);display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(6px)}
#photo-viewer.on{display:flex}
#photo-viewer img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:var(--r-md);box-shadow:0 20px 70px rgba(0,0,0,.7)}
#photo-viewer .pv-close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;margin:0;background:#fff;color:#111;border-radius:50%;width:46px;height:46px;padding:0;font-size:22px}

/* ===== أوضاع خاصة ===== */
body.peek header,body.peek main,body.peek #nv,body.peek #fab{opacity:0;pointer-events:none;transition:opacity .25s}

/* ===== استجابة ===== */
@media(min-width:620px){.photo-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.photo-thumb{height:168px}}
@media(min-width:860px){#fab{left:auto;right:calc(50% - 430px)}}
@media(max-width:420px){.tt{font-size:16px}}
@media (max-height:520px){
  .kpd.pin{position:static;box-shadow:none}
  .kpd button{padding:7px 0;font-size:14px}
  .kh button{padding:6px 9px}
  .kpd .g4{gap:4px}
  #nv{padding:4px;bottom:4px;width:calc(100% - 16px)}
  #nv button{flex-direction:row;justify-content:center;gap:6px;padding:6px 0;font-size:12px}
  #nv i{font-size:15px}
  #fab{bottom:56px;padding:7px 14px;font-size:12px}
  body{padding-bottom:70px}
}
@media (max-height:720px){.kpd button{padding:7px 0;font-size:15px}.kpd .g4{gap:4px}.kh{margin-bottom:6px}.ki{font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none !important;animation-duration:.01ms !important}}

/* ===== نسخة مضغوطة — أحجام أصغر وأخف ===== */
body{padding:10px 10px 112px;line-height:1.45}
header{padding:9px 12px;margin-bottom:12px;border-radius:18px}
.lg{width:42px;height:42px;border-radius:13px;font-size:22px}
.tt{font-size:17px}
.sb2{font-size:11px}
.cd{padding:12px;margin-bottom:10px;border-radius:18px}
h2{font-size:14.5px;margin-bottom:9px;gap:7px}
h2:before{width:4px;height:14px}
.sn{width:23px;height:23px;font-size:12px}
.pv{font-size:11px;margin:2px 0 5px}
.pv:before{width:6px;height:6px}
th,td{padding:6px 3px;font-size:11px}
th{font-size:10.5px}
input,select,textarea{padding:8px 5px;font-size:13px;border-radius:10px}
input{min-width:52px}
button{padding:9px 13px;font-size:13px;border-radius:12px;margin:6px 0 0 6px}
.sw{width:34px;height:34px}
#nv{padding:4px;border-radius:22px}
#nv button{padding:6px 0;font-size:10px;gap:2px;border-radius:16px}
#nv i{font-size:18px}
#fab{padding:10px 15px;bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#kp{padding:6px 10px calc(10px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0}
#kp:before{width:40px;height:4px;margin:0 auto 8px}
#kp button{padding:9px 0;font-size:15px}
.kpd{margin-top:8px;padding:8px;border-radius:12px}
.kpd button{padding:8px 0;font-size:14px}

async function submitReq(plan,name,phone){
 if(!name||dg(phone).length<8){show("اكتب الاسم ورقم الواتساب",1);return}
 show("جاري إنشاء الكود...");let a;try{a=await auth()}catch(e){show("تعذّر الاتصال. حاول مرة أخرى",1);return}
 for(let i=0;i<4;i++){const code=genCode();
  try{const r=await fetch(`https://firestore.googleapis.com/v1/projects/${LIC.projectId}/databases/(default)/documents/${LIC.col}?documentId=${code}&key=${LIC.apiKey}`,{method:"POST",headers:{Authorization:"Bearer "+a.t,"Content-Type":"application/json"},body:JSON.stringify({fields:{status:{stringValue:"pending"},plan:{stringValue:plan},name:{stringValue:name},phone:{stringValue:dg(phone)},uid:{stringValue:a.u}}})});
   if(r.ok){doneReq(code,plan,name);return}if(r.status!=409)break}catch(e){break}}
 show("تعذّر إنشاء الطلب. حاول لاحقاً أو تواصل معنا",1)}
function doneReq(code,plan,name){try{localStorage.setItem("lic_req",code)}catch(e){}
 g("lki").value=code;const w=g("lkw");w.textContent="";
 const c=el("div","rqc",code),l=el("a","wl g2","إرسال الكود على واتساب");
 l.href=wa("طلب "+PL[plan]+" في تطبيق AL-TONY\nالكود: "+code+"\nالاسم: "+name);l.target="_blank";l.rel="noopener";
 w.append(c,l);show("تم إنشاء كودك. أرسله لنا على واتساب ليتم التفعيل، ثم اضغط تفعيل",0)}
planBtns();try{const rq=localStorage.getItem("lic_req");if(rq)g("lki").value=rq}catch(e){}
